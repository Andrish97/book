# Konfiguracja Supabase dla integracji z GitHubem
# (Supabase → Project Settings → Integrations → GitHub, opcja „Deploy to production”).
# Po pushu na main integracja stosuje migracje z supabase/migrations/
# („Deploy to production” włączone 2026-11-10).
# Ustawienia logowania z tego pliku przenosi tylko dlatego, że blok [remotes.production]
# niżej wskazuje ten sam projekt – bez niego integracja je pomija.
project_id = "pganajmivwtstapnwsgv"

[remotes.production]
project_id = "pganajmivwtstapnwsgv"

[auth]
# Adres aplikacji i adresy, na które może wrócić link z e-maila.
site_url = "https://makietka.app/"
additional_redirect_urls = ["https://makietka.app/**", "http://localhost:8000/**"]
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
# Konto działa od razu po rejestracji, bez linku w wiadomości: wbudowana poczta
# Supabase dostarcza wiadomości tylko właścicielom projektu. Po podpięciu własnego
# serwera poczty (SMTP) można zmienić na true – aplikacja obsługuje oba warianty.
enable_confirmations = false
# Zmianę adresu potwierdza się linkiem z nowej skrzynki.
double_confirm_changes = false
secure_password_change = false
max_frequency = "1m0s"

# Własne szablony wiadomości są wyłączone: Supabase z wbudowaną pocztą odrzuca ich zmianę
# i całe wdrożenie (razem z migracjami) kończy się błędem. Poczta: Brevo (docs/KONFIGURACJA-DOMENY.md).
# Serwer poczty (SMTP) ustawia się w panelu Supabase (Authentication → Emails → SMTP Settings) – hasła
# nie trzymamy w repozytorium. Ten plik nie ma bloku [auth.email.smtp] – wdrożenie nie powinno ruszać
# ustawień z panelu (sprawdzić po pierwszym wdrożeniu: docs/KONFIGURACJA-DOMENY.md, krok 6).
# Dopiero gdy SMTP w panelu działa, odkomentuj poniższe bloki (i ewentualnie enable_confirmations = true).
# [auth.email.template.confirmation]
# subject = "Makietka – potwierdź konto"
# content_path = "./supabase/templates/potwierdzenie.html"
#
# [auth.email.template.recovery]
# subject = "Makietka – ustaw nowe hasło"
# content_path = "./supabase/templates/reset-hasla.html"
#
# [auth.email.template.email_change]
# subject = "Makietka – potwierdź nowy adres e-mail"
# content_path = "./supabase/templates/zmiana-email.html"

# Funkcje Edge wdrażane przez integrację z GitHubem – tylko te zadeklarowane tutaj.
[functions.zdrowie]
verify_jwt = false

# Zdalny łącznik MCP dla AI (supabase/functions/mcp): Claude i ChatGPT łączą się z nim ze swoich serwerów.
# Integracja z GitHubem wdraża tylko funkcje wpisane tutaj. Bez sprawdzania JWT – dostęp daje klucz sdk_…
# z adresu łącznika, który sprawdza baza (funkcje ai_projekt / ai_zapisz).
[functions.mcp]
enabled = true
verify_jwt = false
entrypoint = "./functions/mcp/index.ts"
