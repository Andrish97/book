<title>Uzasadnienie Seriodruku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap">
<style>
/* Układ: wąska szyna ze spisem po lewej, kolumna do czytania po prawej;
   każda funkcja to wpis z etykietami części na marginesie. Kolory i kroje z aplikacji. */
:root {
  --papier: #f4f3ef;
  --powierzchnia: #ffffff;
  --wypelnienie: #efeee9;
  --linia: #e3e1da;
  --linia-mocna: #cfccc3;
  --tusz: #1c1b19;
  --tusz-2: #4a4843;
  --cichy: #807d75;
  --akcent: #2f5bd3;
  --akcent-tlo: #eaf0fd;
  --na-akcencie-tle: #1d3f9e;
  --uwaga: #b45309;
  --uwaga-tlo: #fdf3e5;
  --blad: #b42318;
  --blad-tlo: #fdecea;
  --sukces: #18794e;
  --sukces-tlo: #e3f4ea;
  --zaslona: rgba(28, 27, 25, .6);
  --cien-strony: 0 2px 4px rgba(28, 27, 25, .08), 0 12px 32px rgba(28, 27, 25, .12);
  --tekst: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tytul: "Playfair Display", Georgia, "Times New Roman", serif;
  --kod: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #151412; --powierzchnia: #1e1d1a; --wypelnienie: #2b2a26; --linia: #33312c; --linia-mocna: #4b4841;
    --tusz: #f1efe9; --tusz-2: #cdc9bf; --cichy: #99958b; --akcent: #86a3f7; --akcent-tlo: #222a44; --na-akcencie-tle: #c3d1fb;
    --uwaga: #f0a45e; --uwaga-tlo: #382917; --blad: #f28f86; --blad-tlo: #3b1f1c; --sukces: #74d6a3; --sukces-tlo: #17362a;
    --zaslona: rgba(0, 0, 0, .75); --cien-strony: 0 2px 6px rgba(0, 0, 0, .5), 0 14px 36px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #151412; --powierzchnia: #1e1d1a; --wypelnienie: #2b2a26; --linia: #33312c; --linia-mocna: #4b4841;
  --tusz: #f1efe9; --tusz-2: #cdc9bf; --cichy: #99958b; --akcent: #86a3f7; --akcent-tlo: #222a44; --na-akcencie-tle: #c3d1fb;
  --uwaga: #f0a45e; --uwaga-tlo: #382917; --blad: #f28f86; --blad-tlo: #3b1f1c; --sukces: #74d6a3; --sukces-tlo: #17362a;
  --zaslona: rgba(0, 0, 0, .75); --cien-strony: 0 2px 6px rgba(0, 0, 0, .5), 0 14px 36px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--papier); color: var(--tusz);
  font: 400 16px/1.65 var(--tekst);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--akcent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--akcent); outline-offset: 2px; border-radius: 4px; }
code { font: 0.86em var(--kod); background: var(--wypelnienie); padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }

.uklad {
  max-width: 72rem; margin: 0 auto;
  padding-block: 3rem 5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 14rem minmax(0, 1fr); column-gap: 3.5rem;
}

/* ---------- Spis ---------- */
.spis { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1.5rem); align-self: start; max-height: calc(100vh - 3rem); overflow-y: auto; font-size: 0.875rem; }
.spis summary { display: none; }
.spis .marka { font: 700 1.25rem/1.2 var(--tytul); margin: 0 0 0.15rem; }
.spis .podmarka { color: var(--cichy); margin: 0 0 1.25rem; font-size: 0.8125rem; }
.spis ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.1rem; }
.spis a { display: flex; gap: 0.6rem; padding: 0.3rem 0.5rem; margin-inline: -0.5rem; border-radius: 6px; color: var(--tusz-2); text-decoration: none; }
.spis a:hover { background: var(--wypelnienie); color: var(--tusz); }
.spis a .lit { font: 600 0.75rem/1.9 var(--kod); color: var(--cichy); width: 1rem; flex: none; }
.filtr { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--linia); display: flex; flex-direction: column; gap: 0.5rem; }
.filtr .etykieta { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cichy); font-weight: 600; }
.filtr .segmenty { display: flex; flex-direction: column; gap: 0.25rem; }
.filtr button {
  font: inherit; text-align: left; color: var(--tusz-2); background: none; border: 1px solid transparent;
  padding: 0.35rem 0.6rem; border-radius: 6px; cursor: pointer;
}
.filtr button:hover { background: var(--wypelnienie); }
.filtr button[aria-pressed="true"] { background: var(--akcent-tlo); color: var(--na-akcencie-tle); font-weight: 600; }

/* ---------- Nagłówek ---------- */
main { min-width: 0; max-width: 46rem; }
.czolowka { padding-bottom: 2rem; border-bottom: 1px solid var(--linia-mocna); }
.czolowka .nad { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cichy); font-weight: 600; margin: 0 0 0.75rem; }
h1 { font: 700 clamp(2.1rem, 6vw, 3.1rem)/1.08 var(--tytul); margin: 0 0 1rem; text-wrap: balance; }
.czolowka .wstep { font-size: 1.0625rem; color: var(--tusz-2); margin: 0; max-width: 40rem; }
.legenda { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; margin: 1.5rem 0 0; padding: 0; font-size: 0.875rem; color: var(--tusz-2); }
.legenda li { display: flex; align-items: center; gap: 0.5rem; }

.stan { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.6rem 0.2rem 0.5rem; border-radius: 999px; white-space: nowrap; }
.stan::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: currentColor; flex: none; }
.stan.ok { background: var(--sukces-tlo); color: var(--sukces); }
.stan.czesc { background: var(--uwaga-tlo); color: var(--uwaga); }
.stan.czesc::before { border-radius: 1px; transform: rotate(45deg); }
.stan.brak { background: var(--blad-tlo); color: var(--blad); }
.stan.brak::before { background: none; border: 2px solid currentColor; }

/* ---------- W skrócie ---------- */
.skrot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.75rem; padding-block: 2rem; border-bottom: 1px solid var(--linia-mocna); }
.skrot h2 { font: 600 0.875rem/1.3 var(--tekst); margin: 0 0 0.6rem; display: flex; }
.skrot ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.45rem; font-size: 0.9375rem; line-height: 1.5; color: var(--tusz-2); }

/* ---------- Działy i wpisy ---------- */
.dzial { padding-top: 3rem; scroll-margin-top: 1rem; }
.dzial > header { display: flex; align-items: baseline; gap: 0.9rem; margin-bottom: 0.5rem; }
.dzial > header .lit { font: 600 0.875rem var(--kod); color: var(--akcent); }
h2.tytul-dzialu { font: 700 1.75rem/1.2 var(--tytul); margin: 0; text-wrap: balance; }
.dzial > .opis { color: var(--tusz-2); margin: 0 0 0.5rem; }

.wpis { padding-block: 1.75rem; border-top: 1px solid var(--linia); scroll-margin-top: 1rem; }
.dzial > .wpis:first-of-type { border-top-color: var(--linia-mocna); margin-top: 1rem; }
.wpis > header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; margin-bottom: 1rem; }
.wpis .kod { font: 600 0.75rem var(--kod); color: var(--cichy); min-width: 1.75rem; }
.wpis h3 { font: 600 1.1875rem/1.3 var(--tekst); margin: 0; flex: 1 1 14rem; text-wrap: balance; }
.czesci { margin: 0; display: flex; flex-direction: column; gap: 0.85rem; }
.czesci > div { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); column-gap: 1.25rem; }
.czesci dt { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; color: var(--cichy); padding-top: 0.3rem; }
.czesci dd { margin: 0; color: var(--tusz-2); }
.czesci dd > :first-child { margin-top: 0; }
.czesci dd > :last-child { margin-bottom: 0; }
.czesci dd p { margin: 0 0 0.6rem; }
.czesci dd ul { margin: 0 0 0.6rem; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0.3rem; }
.czesci .slabe dt { color: var(--uwaga); }
.czesci .niema dt { color: var(--blad); }
.czesci strong { color: var(--tusz); font-weight: 600; }

figure { margin: 1.5rem 0 0; }
figure button { display: block; width: 100%; padding: 0; border: 1px solid var(--linia-mocna); border-radius: 8px; overflow: hidden; background: var(--powierzchnia); cursor: zoom-in; box-shadow: var(--cien-strony); }
figure img { display: block; width: 100%; height: auto; }
figure.waski { max-width: 17rem; }
figcaption { font-size: 0.8125rem; color: var(--cichy); margin-top: 0.6rem; }

.dalej ol { margin: 1rem 0 0; padding: 0; list-style: none; counter-reset: krok; display: flex; flex-direction: column; }
.dalej li { counter-increment: krok; display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); padding-block: 0.9rem; border-top: 1px solid var(--linia); color: var(--tusz-2); }
.dalej li::before { content: counter(krok); font: 600 0.875rem/1.9 var(--kod); color: var(--akcent); }
.dalej li strong { color: var(--tusz); font-weight: 600; }
.stopka { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--linia-mocna); font-size: 0.8125rem; color: var(--cichy); }

/* ---------- Powiększenie zrzutu ---------- */
dialog.lupa { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1280px); max-height: 94vh; }
dialog.lupa::backdrop { background: var(--zaslona); }
dialog.lupa img { display: block; max-width: 100%; max-height: 86vh; border-radius: 8px; background: var(--powierzchnia); }
dialog.lupa form { display: flex; justify-content: flex-end; margin-bottom: 0.5rem; }
dialog.lupa button { font: 600 0.875rem var(--tekst); color: var(--tusz); background: var(--powierzchnia); border: 1px solid var(--linia-mocna); border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; }

body[data-filtr="uwagi"] .wpis[data-stan="ok"] { display: none; }

@media (max-width: 56rem) {
  .uklad { grid-template-columns: minmax(0, 1fr); padding-block: 1.5rem 3rem; }
  .spis { position: static; max-height: none; margin-bottom: 1.5rem; border: 1px solid var(--linia-mocna); border-radius: 8px; background: var(--powierzchnia); padding: 0.25rem 1rem; }
  .spis summary { display: block; cursor: pointer; font-weight: 600; padding: 0.6rem 0; }
  .spis .marka, .spis .podmarka { display: none; }
  .spis[open] { padding-bottom: 1rem; }
  .filtr .segmenty { flex-direction: row; flex-wrap: wrap; }
  .skrot { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
}
@media (max-width: 34rem) {
  .czesci > div { grid-template-columns: minmax(0, 1fr); row-gap: 0.15rem; }
  .czesci dt { padding-top: 0; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="uklad">
  <details class="spis" id="spis" open>
    <summary>Spis treści i filtr</summary>
    <p class="marka">Seriodruk</p>
    <p class="podmarka">{{STAN}}</p>
    <nav aria-label="Spis treści">
      <ol>
{{SPIS}}
      </ol>
    </nav>
    <div class="filtr">
      <span class="etykieta" id="filtr-etykieta">Pokaż</span>
      <div class="segmenty" role="group" aria-labelledby="filtr-etykieta">
        <button type="button" id="filtr-wszystko" data-filtr="wszystko" aria-pressed="true">Wszystkie funkcje</button>
        <button type="button" id="filtr-uwagi" data-filtr="uwagi" aria-pressed="false">Tylko z zastrzeżeniami i braki</button>
      </div>
    </div>
  </details>

  <main>
    <header class="czolowka">
      <p class="nad">Seriodruk · funkcja po funkcji</p>
      <h1>Dlaczego tak, co jest słabe i co można zrobić lepiej</h1>
      <p class="wstep">{{WSTEP}}</p>
      <ul class="legenda" aria-label="Oceny">
        <li><span class="stan ok">Dobrze</span> zostawiłbym tak, jak jest</li>
        <li><span class="stan czesc">Z zastrzeżeniami</span> działa, ale ma słabe strony</li>
        <li><span class="stan brak">Brak</span> nie zrobione albo nie działa</li>
      </ul>
    </header>

{{TRESC}}
  </main>
</div>

<dialog class="lupa" id="lupa" aria-label="Powiększony zrzut ekranu">
  <form method="dialog"><button type="submit" id="lupa-zamknij">Zamknij</button></form>
  <img id="lupa-obraz" alt="">
</dialog>

<script>
(() => {
  const spis = document.getElementById('spis');
  const waski = window.matchMedia('(max-width: 56rem)');
  const ustawSpis = () => { spis.open = !waski.matches; };
  ustawSpis();
  waski.addEventListener('change', ustawSpis);

  // Filtr: tylko wpisy z zastrzeżeniami i braki; działy bez widocznych wpisów znikają.
  const przyciski = [...document.querySelectorAll('.filtr button')];
  const zastosuj = (filtr) => {
    document.body.dataset.filtr = filtr;
    for (const b of przyciski) b.setAttribute('aria-pressed', String(b.dataset.filtr === filtr));
    for (const d of document.querySelectorAll('.dzial')) {
      const wpisy = [...d.querySelectorAll('.wpis')];
      d.hidden = filtr === 'uwagi' && wpisy.length > 0 && wpisy.every((w) => w.dataset.stan === 'ok');
    }
    try { localStorage.setItem('uzasadnienie-filtr', filtr); } catch { /* bez pamięci też działa */ }
  };
  for (const b of przyciski) b.addEventListener('click', () => zastosuj(b.dataset.filtr));
  let zapamietany = 'wszystko';
  try { zapamietany = localStorage.getItem('uzasadnienie-filtr') || 'wszystko'; } catch { /* brak dostępu */ }
  if (zapamietany === 'uwagi') zastosuj('uwagi');

  // Powiększenie zrzutu po kliknięciu.
  const lupa = document.getElementById('lupa');
  const obraz = document.getElementById('lupa-obraz');
  for (const b of document.querySelectorAll('[data-lupa]')) {
    b.addEventListener('click', () => {
      const img = b.querySelector('img');
      obraz.src = img.src;
      obraz.alt = img.alt;
      if (typeof lupa.showModal === 'function') lupa.showModal();
    });
  }
  lupa.addEventListener('click', (e) => { if (e.target === lupa) lupa.close(); });
})();
</script>
