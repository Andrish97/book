name: Testy

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Niezależne programy do kontroli plików PDF (tests/pdf-kontrola.test.cjs): składnia, czcionki,
      # obrazy i rozbarwienie na farby. Bez nich ten jeden test się pomija.
      - name: Programy do kontroli PDF
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ghostscript qpdf poppler-utils

      - name: Sprawdzenie kodu (nazwy bez definicji, nieużywane importy)
        run: npm run lint

      - name: Testy przeglądarkowe
        run: npm test

      - name: Pomiary testów PDF (zgodność obrazu z aplikacją)
        if: always()
        run: cat tests/.pomiary-pdf.txt 2>/dev/null || echo "brak pomiarów"
