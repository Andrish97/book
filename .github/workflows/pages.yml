name: Deploy aplikacji na GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Przygotuj pliki strony
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js img ai llms.txt _site/
          touch _site/.nojekyll
          # Numer wersji i lista plików kodu dla service workera (pamięć jednej wersji naraz).
          python3 scripts/wersja-sw.py _site "${GITHUB_SHA::12}"
          # Rozszerzenie Claude Desktop (.mcpb) z łącznikiem – pobierane z okna „Dostęp dla AI”.
          python3 scripts/rozszerzenie-mcpb.py _site/ai/mcp/makietka.mcpb

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

